<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<title>房租水电账单</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：单列手机账单——顶部查房号，下方一张缴费单，读数用电表式数字格显示 */
:root{
  --bg:#eef2f1; --card:#ffffff; --ink:#1d2a27; --muted:#66756f; --line:#d5dedb;
  --accent:#1f6b52; --accent-soft:#e1efe9; --digit-bg:#20302b; --digit-fg:#f3f6f4;
  --warn:#b4432e; --warn-soft:#f7e3de; --ok:#2f7d4f; --ok-soft:#dff0e5;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --card:#1b2421; --ink:#e6ece9; --muted:#93a39d; --line:#2e3a36;
  --accent:#5cc49a; --accent-soft:#1f3a30; --digit-bg:#0b100e; --digit-fg:#e9f2ee;
  --warn:#ef8a72; --warn-soft:#3d2520; --ok:#6fd19a; --ok-soft:#1d3a2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --card:#1b2421; --ink:#e6ece9; --muted:#93a39d; --line:#2e3a36;
  --accent:#5cc49a; --accent-soft:#1f3a30; --digit-bg:#0b100e; --digit-fg:#e9f2ee;
  --warn:#ef8a72; --warn-soft:#3d2520; --ok:#6fd19a; --ok-soft:#1d3a2a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;text-wrap:balance;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
form.q{display:flex;gap:8px}
#room{flex:1;min-width:0;font:600 22px var(--mono);letter-spacing:.12em;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);text-align:center}
#room:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{font:600 17px var(--font);border:0;border-radius:10px;padding:0 22px;background:var(--accent);color:var(--card);cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;font:500 14px var(--font);padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.msg{background:var(--warn-soft);color:var(--warn);padding:12px 14px;border-radius:10px;font-size:15px}
.bill{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.bill-head{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 18px 14px;border-bottom:1px dashed var(--line);gap:12px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.08em}
.roomno{font:700 30px var(--mono);letter-spacing:.06em;line-height:1.1}
.total{text-align:right}
.total .amt{font:700 34px var(--mono);color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.total .amt small{font-size:18px;margin-right:2px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--warn-soft);color:var(--warn)}
.rows{padding:6px 18px 12px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-weight:600}
.row .fee{font:600 17px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.meter{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rd{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.arrow{color:var(--muted)}
.calc{grid-column:1 / -1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.greet{padding:18px 18px 4px;font-size:15px;line-height:1.7;display:flex;flex-direction:column;gap:4px}
.greet p{margin:0}
.greet .hi{font-weight:600;font-size:16px}
.greet b{color:var(--accent)}
.greet .wish{color:var(--muted);font-size:14px}
.pay{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrimg{width:260px;max-width:100%;height:auto;border-radius:10px;display:block;-webkit-touch-callout:default}
.qr{width:200px;max-width:100%;aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:12px}
.pay-t{margin:0;font-size:18px}
.steps{margin:0;padding-left:1.4em;text-align:left;align-self:stretch;display:flex;flex-direction:column;gap:6px;font-size:15px}
.steps .big{font-family:var(--mono);color:var(--accent);font-size:18px}
.steps .alt{color:var(--muted);font-size:13px}
.pay-note{margin:0;color:var(--muted);font-size:13px}
.foot{color:var(--muted);font-size:13px;text-align:center}
</style>
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>房租水电账单</h1>
    <p class="sub">输入你的房间号，查看本月应付金额和水电明细</p>
  </header>

  <form class="q" id="qform" autocomplete="off">
    <input id="room" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="例如 101" aria-label="房间号">
    <button type="submit">查询</button>
  </form>

  <div class="msg" id="msg" hidden></div>
  <section class="bill" id="bill" hidden></section>

  <section class="pay" id="pay" hidden>
    <h2 class="pay-t">微信付款</h2>
    <ol class="steps">
      <li><b>长按</b>下方二维码，选择「识别图中二维码」<br><span class="alt">长按没有这个选项：点「保存图片」，再打开微信「扫一扫」，点右上角相册选这张图</span></li>
      <li>输入金额 <b class="big" id="payamt"></b></li>
      <li>点「添加备注」，填写房号 <b class="big" id="rmk"></b>，再付款</li>
    </ol>
    <img class="qrimg" id="qr" alt="微信收款码" src="qr.jpg">
    <p class="pay-note">备注房号才能快速确认是你交的，谢谢配合</p>
  </section>

  <p class="foot">水电读数有疑问，请联系管理员核对</p>
</div>

<script>
const DATA=[{"m":"26.11","wp":4,"ep":1.2,"pay":true,"rooms":{"101":{"rent":355,"w0":346,"w1":349,"wf":12,"e0":1554,"e1":1606,"ef":62,"net":30,"gar":30,"tot":489,"paid":false},"102":{"rent":355,"w0":266,"w1":268,"wf":8,"e0":1157,"e1":1237,"ef":96,"net":0,"gar":15,"tot":474,"paid":false},"103":{"rent":355,"w0":365,"w1":366,"wf":4,"e0":4075,"e1":4167,"ef":110,"net":0,"gar":15,"tot":484,"paid":false},"104":{"rent":325,"w0":618,"w1":621,"wf":12,"e0":3419,"e1":3520,"ef":121,"net":0,"gar":15,"tot":473,"paid":false},"105":{"rent":355,"w0":543,"w1":545,"wf":8,"e0":1407,"e1":1437,"ef":36,"net":0,"gar":15,"tot":414,"paid":false},"106":{"rent":355,"w0":704,"w1":711,"wf":28,"e0":2496,"e1":2591,"ef":114,"net":20,"gar":15,"tot":532,"paid":false},"201":{"rent":455,"w0":801,"w1":804,"wf":12,"e0":1501,"e1":1576,"ef":90,"net":0,"gar":15,"tot":572,"paid":false},"202":{"rent":425,"w0":470,"w1":474,"wf":16,"e0":1758,"e1":1811,"ef":64,"net":0,"gar":15,"tot":520,"paid":false},"203":{"rent":355,"w0":28,"w1":30,"wf":8,"e0":1946,"e1":2004,"ef":70,"net":0,"gar":15,"tot":448,"paid":false},"204":{"rent":355,"w0":373,"w1":374,"wf":4,"e0":1025,"e1":1048,"ef":28,"net":30,"gar":15,"tot":432,"paid":false},"205":{"rent":355,"w0":350,"w1":353,"wf":12,"e0":1545,"e1":1606,"ef":73,"net":30,"gar":15,"tot":485,"paid":false},"206":{"rent":355,"w0":554,"w1":563,"wf":36,"e0":3511,"e1":3731,"ef":264,"net":0,"gar":30,"tot":685,"paid":false},"207":{"rent":355,"w0":577,"w1":579,"wf":8,"e0":1384,"e1":1424,"ef":48,"net":0,"gar":15,"tot":426,"paid":false},"208":{"rent":355,"w0":555,"w1":559,"wf":16,"e0":925,"e1":946,"ef":25,"net":30,"gar":15,"tot":441,"paid":false},"301":{"rent":455,"w0":45,"w1":46,"wf":4,"e0":1558,"e1":1615,"ef":68,"net":0,"gar":15,"tot":542,"paid":false},"302":{"rent":455,"w0":694,"w1":699,"wf":20,"e0":2222,"e1":2384,"ef":194,"net":30,"gar":30,"tot":729,"paid":false},"303":{"rent":0,"w0":103,"w1":103,"wf":0,"e0":4849,"e1":4849,"ef":0,"net":30,"gar":30,"tot":60,"paid":false},"304":{"rent":355,"w0":488,"w1":493,"wf":20,"e0":2046,"e1":2156,"ef":132,"net":30,"gar":15,"tot":552,"paid":false},"305":{"rent":355,"w0":347,"w1":350,"wf":12,"e0":1844,"e1":1922,"ef":94,"net":30,"gar":15,"tot":506,"paid":false},"306":{"rent":355,"w0":420,"w1":421,"wf":4,"e0":1341,"e1":1385,"ef":53,"net":0,"gar":15,"tot":427,"paid":false},"307":{"rent":355,"w0":401,"w1":403,"wf":8,"e0":1255,"e1":1294,"ef":47,"net":0,"gar":15,"tot":425,"paid":false},"308":{"rent":355,"w0":492,"w1":497,"wf":20,"e0":1971,"e1":2086,"ef":138,"net":0,"gar":15,"tot":528,"paid":false},"401":{"rent":455,"w0":474,"w1":479,"wf":20,"e0":2864,"e1":2931,"ef":80,"net":30,"gar":30,"tot":615,"paid":false},"402":{"rent":455,"w0":481,"w1":482,"wf":4,"e0":1240,"e1":1278,"ef":46,"net":0,"gar":15,"tot":520,"paid":false},"403":{"rent":0,"w0":51,"w1":51,"wf":0,"e0":746,"e1":746,"ef":0,"net":0,"gar":15,"tot":15,"paid":false},"404":{"rent":355,"w0":215,"w1":217,"wf":8,"e0":821,"e1":859,"ef":46,"net":0,"gar":15,"tot":424,"paid":false},"405":{"rent":355,"w0":29,"w1":31,"wf":8,"e0":1621,"e1":1719,"ef":118,"net":30,"gar":15,"tot":526,"paid":false},"406":{"rent":355,"w0":473,"w1":474,"wf":4,"e0":1910,"e1":1952,"ef":50,"net":0,"gar":15,"tot":424,"paid":false},"407":{"rent":0,"w0":531,"w1":531,"wf":0,"e0":1460,"e1":1460,"ef":0,"net":0,"gar":15,"tot":15,"paid":false},"408":{"rent":355,"w0":740,"w1":746,"wf":24,"e0":3253,"e1":3395,"ef":170,"net":30,"gar":15,"tot":594,"paid":false},"501":{"rent":425,"w0":155,"w1":162,"wf":28,"e0":7932,"e1":8284,"ef":422,"net":0,"gar":30,"tot":905,"paid":false},"502":{"rent":0,"w0":612,"w1":612,"wf":0,"e0":3663,"e1":3663,"ef":0,"net":0,"gar":15,"tot":15,"paid":false},"503":{"rent":355,"w0":611,"w1":614,"wf":12,"e0":1048,"e1":1065,"ef":20,"net":0,"gar":15,"tot":402,"paid":false},"504":{"rent":355,"w0":527,"w1":533,"wf":24,"e0":3503,"e1":3634,"ef":157,"net":0,"gar":15,"tot":551,"paid":false},"505":{"rent":355,"w0":630,"w1":631,"wf":4,"e0":143,"e1":146,"ef":4,"net":0,"gar":15,"tot":378,"paid":false},"506":{"rent":355,"w0":487,"w1":497,"wf":40,"e0":1659,"e1":1691,"ef":38,"net":0,"gar":15,"tot":448,"paid":false},"507":{"rent":355,"w0":105,"w1":110,"wf":20,"e0":4446,"e1":4543,"ef":116,"net":30,"gar":15,"tot":536,"paid":false},"508":{"rent":355,"w0":448,"w1":451,"wf":12,"e0":1189,"e1":1251,"ef":74,"net":0,"gar":15,"tot":456,"paid":false},"601":{"rent":405,"w0":300,"w1":301,"wf":4,"e0":737,"e1":743,"ef":7,"net":0,"gar":30,"tot":446,"paid":false},"602":{"rent":405,"w0":605,"w1":610,"wf":20,"e0":3662,"e1":3809,"ef":176,"net":25,"gar":15,"tot":641,"paid":false},"603":{"rent":355,"w0":775,"w1":783,"wf":32,"e0":6071,"e1":6198,"ef":152,"net":0,"gar":30,"tot":569,"paid":false},"604":{"rent":355,"w0":552,"w1":555,"wf":12,"e0":3258,"e1":3397,"ef":167,"net":0,"gar":15,"tot":549,"paid":false},"605":{"rent":175,"w0":30,"w1":31,"wf":4,"e0":1854,"e1":1938,"ef":101,"net":0,"gar":15,"tot":295,"paid":false},"606":{"rent":355,"w0":560,"w1":564,"wf":16,"e0":2438,"e1":2497,"ef":71,"net":30,"gar":15,"tot":487,"paid":false},"607":{"rent":0,"w0":513,"w1":514,"wf":4,"e0":1139,"e1":1139,"ef":0,"net":0,"gar":15,"tot":19,"paid":false},"608":{"rent":355,"w0":368,"w1":372,"wf":16,"e0":2837,"e1":2880,"ef":52,"net":0,"gar":15,"tot":438,"paid":false}}}];
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(n*100)/100).toString();
const rnd=n=>Math.round((n||0)+1e-9);
const monthName=m=>{const [y,mm]=m.split('.');return `20${y}年${parseInt(mm,10)}月`};
let cur=DATA.length-1, room='';
try{room=localStorage.getItem('room')||''}catch(e){}
$('room').value=room;

function chips(){
  if(!$('months'))return;
  const box=$('months');box.innerHTML='';
  DATA.slice().reverse().forEach((d,ri)=>{
    const i=DATA.length-1-ri;
    const b=document.createElement('button');b.type='button';b.className='chip';
    b.textContent=monthName(d.m);b.setAttribute('aria-pressed',i===cur);
    b.onclick=()=>{cur=i;chips();render()};box.appendChild(b);
  });
}
function digits(n){return `<span class="rd">${n}</span>`}
function meterRow(name,unit,price,a,b,fee){
  const used=b-a;
  return `<div class="row"><span class="name">${name}</span><span class="fee">¥${fmt(fee)}</span>
    <div class="meter">上月 ${digits(a)} <span class="arrow">→</span> 本月 ${digits(b)}</div>
    </div>`;
}
function plain(name,fee){return `<div class="row"><span class="name">${name}</span><span class="fee">¥${fmt(fee)}</span></div>`}
function render(){
  const msg=$('msg'),bill=$('bill'),pay=$('pay');
  if(!DATA.length){msg.textContent='暂时还没有账单数据';msg.hidden=false;return}
  const d=DATA[cur];
  if(!room){msg.hidden=true;bill.hidden=true;pay.hidden=true;return}
  const r=d.rooms[room];
  if(!r){msg.textContent=`${monthName(d.m)}没有找到 ${room} 房的账单，请检查房间号`;msg.hidden=false;bill.hidden=true;pay.hidden=true;return}
  msg.hidden=true;
  let rows='';
  const rent=r.rent||0, gar=r.gar||0;
  if(r.rg!=null && Math.abs(r.rg-(rent+gar))>0.001) rows+=plain('房租（含垃圾费）',r.rg);
  else{rows+=plain('房租',rent); if(gar) rows+=plain('垃圾费',gar)}
  if(r.w0!=null&&r.w1!=null) rows+=meterRow('水费','吨',d.wp,r.w0,r.w1,r.wf||0);
  if(r.e0!=null&&r.e1!=null) rows+=meterRow('电费','度',d.ep,r.e0,r.e1,rnd(r.ef));
  if(r.net) rows+=plain('网络费',r.net);
  const badge=d.pay?(r.paid?'<span class="badge ok">已付款</span>':'<span class="badge no">未付款</span>'):'';
  bill.innerHTML=`<div class="greet"><p class="hi">亲爱的朋友，你好：</p>
      <p>这是你 <b>${monthName(d.m)}</b> 的房租账单。请在每月 <b>1–5 日</b>内交房租；如有特殊情况，请提前联系管理员说明，我们一起商量解决。</p>
      <p class="wish">感谢你一直以来的配合，祝生活顺心！</p></div>
    <div class="bill-head">
      <div><div class="lbl">${monthName(d.m)} · 房号</div><div class="roomno">${room}</div></div>
      <div class="total"><div class="lbl">应付合计</div><div class="amt"><small>¥</small>${rnd(r.tot)}</div>${badge}</div>
    </div><div class="rows">${rows}</div>`;
  bill.hidden=false;
  $('rmk').textContent=room;$('payamt').textContent='¥'+rnd(r.tot);pay.hidden=!!r.paid;
}
$('qform').addEventListener('submit',e=>{
  e.preventDefault();room=$('room').value.trim();
  try{localStorage.setItem('room',room)}catch(err){}
  render();
});
chips();render();
</script>

</body>
</html>
